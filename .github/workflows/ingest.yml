name: ingest

# On the quarter hour. Cloud Scheduler runs the same job at :07/:22/:37/:52 --
# deliberately offset, not duplicated by accident.
#
# Two reasons for the offset. Writing to BigQuery from two runs at the same
# instant invites concurrent-DML contention on the same table for no benefit;
# and interleaving them halves the worst-case staleness, because a miss on one
# scheduler is covered ~7 minutes later by the other rather than 15.
#
# Running both at all is a response to a measured failure: GitHub's scheduler
# produced zero runs in the first hour after this workflow was added, while
# Cloud Scheduler fired on its first attempt. See README, "The finding that
# changed the design".
#
# Known failure mode, documented rather than discovered: GitHub disables
# scheduled workflows in a repo with no commits for 60 days. See docs/runbook.md.
on:
  schedule:
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and report without writing"
        type: boolean
        default: false

# Never let two runs MERGE into the same table at once. A delayed run overlapping
# the next scheduled one is exactly the sort of thing that happens at 3 a.m.
concurrency:
  group: usgs-ingest
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to mint the OIDC token for Workload Identity Federation

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      BQ_DATASET: ${{ vars.BQ_DATASET }}
      BQ_LOCATION: ${{ vars.BQ_LOCATION }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # No service-account key anywhere in this repo. The runner proves its
      # identity with a short-lived OIDC token that Google exchanges for a
      # ~1-hour access token, and the trust is scoped to this one repository.
      # There is no long-lived credential to leak, rotate, or accidentally commit.
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Ingest
        run: python -m pipeline.ingest ${{ inputs.dry_run && '--dry-run' || '' }}
